[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tickets-backend"
version = "0.1.0"
description = "API оформления билетов на мероприятие"
requires-python = ">=3.12"
# Версии закреплены точно: сборка воспроизводима, обновление — осознанное решение.
dependencies = [
    "fastapi==0.159.1",
    "uvicorn==0.54.0",
    "SQLAlchemy==2.0.55",
    # Нужен async-режиму SQLAlchemy; на macOS arm64 сам не подтягивается, поэтому указан явно
    "greenlet==3.5.6",
    "aiosqlite==0.22.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "email-validator==2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "ruff==0.17.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F — базовые ошибки, I — порядок импортов, B — типичные баги, UP — современный синтаксис
select = ["E", "F", "I", "B", "UP"]
